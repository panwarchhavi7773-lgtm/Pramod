<!DOCTYPE html>
<html>
<head>
<title>For You ❤️</title>
<style>
body{
text-align:center;
background:pink;
font-family:Georgia;
padding:50px 20px;
color:#5a3042;
}
.box{
background:white;
padding:30px;
border-radius:30px;
}
button{
background:#e88aaa;
color:white;
border:0;
padding:15px 25px;
border-radius:25px;
font-size:17px;
}
</style>
</head>
<body>

<div class="box">

<h1>Hey You... 💌</h1>

<p>I have a little surprise for you ❤️</p>

<button onclick="show()">Open It 💗</button>

<div id="surprise"></div>

</div>

<script>
function show(){
document.getElementById("surprise").innerHTML=
"<h1>Happy Birthday, Pramod ❤️🎂</h1><p>You are really special to me. 🥹❤️</p><p>Hope your day is as beautiful as you are.</p><h2>With love 💌</h2>";
}
</script>

</body>
</html>
