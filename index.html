<!DOCTYPE html>
<html>
<head>
<title>For You ❤️</title>

<style>
body{
margin:0;
text-align:center;
background:linear-gradient(#ffd6e5,#fff0f5);
font-family:Georgia;
padding:30px 15px;
color:#5a3042;
overflow-x:hidden;
}

.box{
background:white;
padding:25px;
border-radius:30px;
box-shadow:0 8px 25px rgba(0,0,0,0.15);
}

h1{
color:#d85b86;
}

button{
background:#e88aaa;
color:white;
border:0;
padding:15px 25px;
border-radius:25px;
font-size:17px;
cursor:pointer;
}

audio{
width:90%;
margin-bottom:20px;
}

.message{
font-size:17px;
line-height:1.7;
text-align:left;
}

.photos{
margin-top:25px;
}

.photos img{
width:90%;
max-width:350px;
margin:12px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
transition:transform 0.3s;
}

.photos img:hover{
transform:scale(1.03);
}

.heart{
position:fixed;
top:-20px;
font-size:22px;
animation:fall 5s linear infinite;
z-index:10;
}

@keyframes fall{
0%{
transform:translateY(-20px) rotate(0deg);
opacity:1;
}
100%{
transform:translateY(110vh) rotate(360deg);
opacity:0;
}
}

.final{
text-align:center;
margin-top:30px;
padding:20px;
background:#fff0f5;
border-radius:25px;
}

</style>
</head>

<body>

<div class="heart" style="left:10%;animation-delay:0s;">❤️</div>
<div class="heart" style="left:25%;animation-delay:1s;">💗</div>
<div class="heart" style="left:45%;animation-delay:2s;">💖</div>
<div class="heart" style="left:65%;animation-delay:0.5s;">💕</div>
<div class="heart" style="left:85%;animation-delay:1.5s;">❤️</div>

<audio controls loop>
<source src="Heeriye_320(KoshalWorld.Com).mp3" type="audio/mpeg">
</audio>

<div class="box">

<h1>Hey You... 💌</h1>

<p>I have a little surprise for you ❤️</p>

<button onclick="show()">Open It 💗</button>

<div id="surprise"></div>

</div>

document.getElementById("surprise").innerHTML = `

<p>

<h2>Aap mere liye sach mein bahut special ho. ❤️</h2>

<div class="photos">

<h2>Happy Birthday once again! 🎂❤️</h2>

<p>— From someone who genuinely cares about you 🫶🏻</p>

`;

</script>

</body>
</html>
